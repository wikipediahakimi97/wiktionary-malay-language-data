name: Download and localize Wiktionary data modules

on:
  workflow_dispatch:
    inputs:
      ms_before:
        description: 'Only when no saved Malay baseline exists: UTC revision cutoff; blank = current'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: wiktionary-language-localizer
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download, clean Malay duplicates, localize names and repair aliases
        env:
          MS_BEFORE: ${{ inputs.ms_before }}
        run: python scripts/sync_modules.py --ms-before "$MS_BEFORE"

      - name: Show summary
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshots, localized data and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources localized reports
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Refresh Wiktionary data and localize Malay canonical names'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
